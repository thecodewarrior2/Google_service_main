# Dependabot proposes dependency updates as pull requests on this testing repository, never straight to
# the product. Each one is tested by .github/workflows/test.yml, then tried and approved like any other
# change before it goes to google_service_main (CLAUDE.md).
# Security fixes come as soon as an advisory is published once "Dependabot security updates" is on
# (Settings > Code security); the weekly runs below propose ordinary updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Minor and patch updates in one pull request a week; a major version gets its own.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
